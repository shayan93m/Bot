<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>حساب کاربری من | سامانه هوشمند کافی‌نت من</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="nav.js"></script>
</head>
<body>

  <main>
    <h2 class="section-title">حساب کاربری من</h2>

    <!-- تب‌ها: پروفایل / سفارشات / کیف پول / خروج -->
    <div class="account-tabs" id="accountTabs">
      <button class="account-tab active" data-tab="profile">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12c2.5 0 4.5-2 4.5-4.5S14.5 3 12 3 7.5 5 7.5 7.5 9.5 12 12 12z" stroke="currentColor" stroke-width="1.8"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>پروفایل</span>
      </button>
      <button class="account-tab" data-tab="orders">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>سفارشات</span>
      </button>
      <button class="account-tab" data-tab="wallet">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="6" width="18" height="13" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.7"/><circle cx="16.5" cy="14" r="1.2" fill="currentColor"/></svg>
        <span>کیف پول</span>
      </button>
      <button class="account-tab" data-tab="logout">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 12h11m0 0-3.5-3.5M21 12l-3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>خروج</span>
      </button>
    </div>

    <!-- محتوای هر تب -->

    <section class="account-panel active" id="panel-profile">
      <div class="account-card">
        <div class="info-row">
          <div class="info-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12c2.5 0 4.5-2 4.5-4.5S14.5 3 12 3 7.5 5 7.5 7.5 9.5 12 12 12z" stroke="currentColor" stroke-width="1.7"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </div>
          <div class="info-text">
            <label>نام و نام خانوادگی</label>
            <div class="info-value" id="profileFullName">—</div>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="7" y="2" width="10" height="20" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="18" r="1" fill="currentColor"/></svg>
          </div>
          <div class="info-text">
            <label>شماره همراه</label>
            <div class="info-value ltr-value" id="profilePhone">—</div>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="12" r="2" stroke="currentColor" stroke-width="1.4"/><path d="M13 10h6M13 14h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </div>
          <div class="info-text">
            <label>کد ملی (نام کاربری)</label>
            <div class="info-value ltr-value" id="profileNid">—</div>
          </div>
        </div>
      </div>
    </section>

    <section class="account-panel" id="panel-orders">
      <div class="account-card account-empty-state">
        <div class="empty-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </div>
        <p>این بخش به‌زودی فعال می‌شود</p>
        <p class="empty-sub">هنوز امکان مشاهده تاریخچه سفارش‌ها در این صفحه وجود ندارد؛ سفارش‌های ثبت‌شده مستقیماً به تیم پشتیبانی ارسال می‌شوند.</p>
      </div>
    </section>

    <section class="account-panel" id="panel-wallet">
      <div class="account-card" style="text-align:center;">
        <div class="wallet-balance-label">موجودی فعلی</div>
        <div class="wallet-balance-amount">۵۰۰٬۰۰۰ تومان</div>
        <button class="wallet-charge-btn" onclick="alert('به زودی امکان شارژ موجودی فعال می‌شود')">⚡ شارژ موجودی</button>
      </div>
    </section>
  </main>

<script>
(function() {
  const user = (typeof getLoggedInUser === 'function') ? getLoggedInUser() : null;
  if (!user) {
    window.location.href = 'index.html';
  } else {
    document.getElementById('profileFullName').textContent = user.fullName || '—';
    document.getElementById('profilePhone').textContent = user.phone || '—';
    document.getElementById('profileNid').textContent = user.nationalId || '—';
  }

  const tabs = document.querySelectorAll('.account-tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const key = tab.dataset.tab;

      if (key === 'logout') {
        if (confirm('آیا می‌خواهید از حساب خود خارج شوید؟')) {
          if (typeof logoutUser === 'function') logoutUser();
        }
        return;
      }

      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');

      document.querySelectorAll('.account-panel').forEach(p => p.classList.remove('active'));
      const panel = document.getElementById('panel-' + key);
      if (panel) panel.classList.add('active');
    });
  });
})();
</script>

</body>
</html>
