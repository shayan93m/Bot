<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>سامانه هوشمند کافی‌نت من</title>
  <link rel="stylesheet" href="style.css">
  <script src="nav.js"></script>
</head>
<body>
  <main>
    <h1 class="section-title" id="categoryTitle">لیست خدمات کافی‌نت</h1>
    <div class="categories-bar" id="categoriesBar"></div>
    <div class="services-grid" id="servicesGrid"></div>
  </main>

  <div class="ai-bot-btn" onclick="openAiChat()" title="گفتگو با هوش مصنوعی">
    <img src="Ai.svg" alt="هوش مصنوعی" style="width:32px; height:32px; object-fit:contain;">
  </div>

  <footer>
    <div class="search-container">
      <ul class="search-results-list" id="searchResults"></ul>
      <div class="search-box">
        <input type="text" id="searchInput" onkeyup="liveSearch()" placeholder="جستجوی تمامی خدمات یا کد خدمت..." autocomplete="off">
      </div>
    </div>
  </footer>

  <!-- مدال‌ها و بقیه بخش‌ها (بدون کدهای AI) -->
  <!-- مدال جزئیات خدمت -->
  <div class="modal" id="serviceModal" onclick="if(event.target===this) closeModal('serviceModal')">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">عنوان خدمت</h2>
        <span style="cursor:pointer;" onclick="closeModal('serviceModal')">✕</span>
      </div>
      <div class="modal-body">
        <p id="modalDesc" style="margin-bottom: 12px; line-height: 1.6; color: #334155;">توضیحات خدمت...</p>
       
        <div class="info-badge" style="background-color: #fef3c7; color: #92400e;">
          <span>📋 مدارک مورد نیاز:</span>
          <span id="modalDocs" style="font-weight: bold;">...</span>
        </div>
        <div class="info-badge">
          <span>هزینه انجام:</span>
          <span id="modalCost" style="color: #059669;">طبق تعرفه</span>
        </div>
        <div class="info-badge">
          <span>زمان انجام کار :</span>
          <span id="modalTime" style="color: #d97706;">سریع</span>
        </div>
        <div class="info-badge">
          <span>زمان نهایی شدن توسط سازمان:</span>
          <span id="modalSystemTime" style="color: #0284c7;">مشخص‌نشده</span>
        </div>
        <div class="btn-group">
          <button class="order-btn" onclick="openOrderModal()">ثبت سفارش</button>
          <button class="close-modal-btn" onclick="closeModal('serviceModal')">بستن</button>
        </div>
      </div>
    </div>
  </div>

  <!-- مدال ثبت سفارش -->
  <div class="modal" id="orderModal" onclick="if(event.target===this) closeModal('orderModal')">
    <div class="modal-content">
      <div class="modal-header">
        <h2>ثبت سفارش: <span id="orderServiceTitle" style="color: var(--secondary-color);"></span></h2>
        <span style="cursor:pointer;" onclick="closeModal('orderModal')">✕</span>
      </div>
      <form onsubmit="submitOrder(event)">
        <div class="form-group">
          <label>نام و نام خانوادگی:</label>
          <input type="text" id="custName" required placeholder="مثال: علی محمدی">
        </div>
        <div id="dynamicInputsContainer"></div>
        <div class="form-group">
          <label>توضیحات تکمیلی (اختیاری):</label>
          <textarea id="custNotes" rows="2" placeholder="اگر توضیح اضافی دارید بنویسید..."></textarea>
        </div>
        <div class="form-group" id="captchaBox">
          <label>کد امنیتی: <span id="captchaQuestion" style="color:#1e3a8a; font-weight:800;"></span></label>
          <input type="number" id="captchaAnswer" required placeholder="حاصل جمع را وارد کنید" inputmode="numeric">
        </div>
        <button type="submit" class="submit-order-btn" id="submitBtn">ارسال سفارش</button>
      </form>
    </div>
  </div>

  <script>
    // ==================== کدهای اصلی بدون AI ====================
    let services = [];
    let currentCategory = 'همه';
    let currentSelectedServiceObj = null;
    let savedScrollY = 0;

    fetch('services.json')
      .then(response => {
        if (!response.ok) throw new Error("فایل JSON یافت نشد.");
        return response.json();
      })
      .then(data => {
        services = data;
        renderCategories();
        renderServices();
      })
      .catch(error => console.error('خطا در بارگذاری خدمات:', error));

    function renderCategories() {
      const categories = ['همه', ...new Set(services.map(s => s.cat))];
      const container = document.getElementById('categoriesBar');
      container.innerHTML = categories.map(cat => `
        <button class="category-chip ${cat === currentCategory ? 'active' : ''}" onclick="filterCategory('${cat}')">${cat}</button>
      `).join('');
    }

    function filterCategory(cat) {
      currentCategory = cat;
      renderCategories();
      renderServices();
    }

    function renderServices() {
      const grid = document.getElementById('servicesGrid');
      const filtered = currentCategory === 'همه' ? services : services.filter(s => s.cat === currentCategory);
      grid.innerHTML = filtered.map(s => `
        <div class="service-card" onclick="openServiceModal('${s.id}')">
          <h3>${s.id}. ${s.title}</h3>
          <span class="category-tag">${s.cat}</span>
        </div>
      `).join('');
    }

    function openServiceModal(serviceId) {
      const item = services.find(s => s.id == serviceId);
      if (!item) return;
      currentSelectedServiceObj = item;
      document.getElementById('modalTitle').innerText = `${item.id}. ${item.title}`;
      document.getElementById('modalDesc').innerText = item.decs || 'توضیحی برای این خدمت ثبت نشده است.';
      document.getElementById('modalDocs').innerText = item.docs || 'مدارک خاصی ذکر نشده است.';
      document.getElementById('modalCost').innerText = item.cost || 'طبق تعرفه';
      document.getElementById('modalTime').innerText = item.time || 'سریع';
      document.getElementById('modalSystemTime').innerText = item.systemTime || 'مشخص‌نشده';
      document.getElementById('serviceModal').style.display = 'flex';
      lockBodyScroll();
    }

    function openOrderModal(serviceIdentifier) {
      if (serviceIdentifier) {
        const found = services.find(s => `${s.id}. ${s.title}` === serviceIdentifier || s.id == serviceIdentifier || s.title == serviceIdentifier);
        if (found) currentSelectedServiceObj = found;
      }
      closeModal('serviceModal');
      const titleText = currentSelectedServiceObj ? `${currentSelectedServiceObj.id}. ${currentSelectedServiceObj.title}` : 'خدمات عمومی';
      document.getElementById('orderServiceTitle').innerText = titleText;
      const container = document.getElementById('dynamicInputsContainer');
      container.innerHTML = '';

      const rawDocs = currentSelectedServiceObj?.docs || '';
      let docItems = rawDocs.split(/،|-|\n/).map(d => d.trim()).filter(d => d.length > 0);

      // نرمال‌سازی تلفن
      docItems = docItems.map(d => {
        const lower = d.replace(/ي/g, 'ی').replace(/ك/g, 'ک');
        if ((lower.includes('سیم کارت') || lower.includes('تلفن') || lower.includes('موبایل') || lower.includes('شماره')) && 
            (lower.includes('بنام متقاضی') || lower.includes('به نام متقاضی'))) {
          return 'تلفن همراه بنام متقاضی';
        }
        return d;
      });

      const hasApplicantPhone = docItems.some(d => d === 'تلفن همراه بنام متقاضی');
      docItems = docItems.filter(d => !(d.includes('تماس') || d.includes('موبایل') || d.includes('تلفن') || d.includes('شماره تماس') || d.includes('شماره همراه')));

      if (!hasApplicantPhone) {
        const phoneGroup = document.createElement('div');
        phoneGroup.className = 'form-group';
        phoneGroup.innerHTML = `<label>تلفن همراه:</label><input type="tel" class="dynamic-doc-input" data-label="تلفن همراه" required placeholder="مثال: ۰۹۱۲۳۴۵۶۷۸۹">`;
        container.appendChild(phoneGroup);
      }

      docItems.forEach((doc) => {
        const fieldGroup = document.createElement('div');
        fieldGroup.className = 'form-group';
        const isFileField = doc.startsWith('**');
        const cleanLabel = isFileField ? doc.replace(/^\*\*\s*/, '').trim() : doc;

        const label = document.createElement('label');
        label.innerText = cleanLabel + ':';
        fieldGroup.appendChild(label);

        let input;
        if (isFileField) {
          input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/*,.heic,.heif,.jpg,.jpeg,.png,.gif,.webp,.bmp,.pdf,.doc,.docx,.zip,.rar';
          input.className = 'dynamic-doc-input dynamic-file-input';
          input.dataset.label = cleanLabel;
          input.required = true;
          input.style.cssText = 'padding:10px; border:1px dashed #94a3b8; border-radius:8px; background:#f8fafc; width:100%;';
          fieldGroup.appendChild(input);
          const hint = document.createElement('small');
          hint.style.cssText = 'display:block; margin-top:6px; color:#64748b; font-size:0.78rem;';
          hint.innerText = 'فرمت‌های مجاز: JPG, PNG, HEIC , PDF، Word، ZIP';
          fieldGroup.appendChild(hint);
        } else if (cleanLabel.includes('آدرس') || cleanLabel.includes('توضیحات')) {
          input = document.createElement('textarea');
          input.rows = 2;
          input.className = 'dynamic-doc-input';
          input.dataset.label = cleanLabel;
          input.required = true;
          input.placeholder = 'وارد کنید...';
          fieldGroup.appendChild(input);
        } else {
          input = document.createElement('input');
          if (cleanLabel.includes('تماس') || cleanLabel.includes('موبایل') || cleanLabel.includes('تلفن') || cleanLabel.includes('کد ملی') || cleanLabel.includes('پستی') || cleanLabel.includes('حساب') || cleanLabel.includes('شبا')) {
            input.type = 'tel';
          } else {
            input.type = 'text';
          }
          input.className = 'dynamic-doc-input';
          input.dataset.label = cleanLabel;
          input.required = true;
          input.placeholder = 'وارد کنید...';
          fieldGroup.appendChild(input);
        }
        container.appendChild(fieldGroup);
      });

      // فایل‌های پیوست
      const fileGroup = document.createElement('div');
      fileGroup.className = 'form-group';
      fileGroup.innerHTML = `<label>پیوست فایل (اختیاری):</label><input type="file" id="orderFiles" class="dynamic-doc-input" data-label="فایل‌های پیوست" multiple accept="image/*,.heic,.heif,.jpg,.jpeg,.png,.gif,.webp,.bmp,.pdf,.doc,.docx,.zip,.rar" style="padding:10px; border:1px dashed #94a3b8; border-radius:8px; background:#f8fafc;">`;
      container.appendChild(fileGroup);

      document.getElementById('orderModal').style.display = 'flex';
      lockBodyScroll();
      generateCaptcha();
    }

    function generateCaptcha() {
      const a = Math.floor(Math.random() * 8) + 2;
      const b = Math.floor(Math.random() * 8) + 2;
      captchaResult = a + b;
      document.getElementById('captchaQuestion').innerText = `${a} + ${b} = ؟`;
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
      const anyOpen = ['serviceModal', 'orderModal'].some(id => document.getElementById(id).style.display === 'flex');
      if (!anyOpen) {
        document.body.classList.remove('modal-open');
        document.body.style.top = '';
        document.body.style.position = '';
        document.body.style.width = '';
        window.scrollTo(0, savedScrollY);
      }
    }

    function liveSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const resultsContainer = document.getElementById('searchResults');
      if (query === '') {
        resultsContainer.style.display = 'none';
        resultsContainer.innerHTML = '';
        return;
      }
      const filtered = services.filter(s => {
        const title = String(s.title || '').toLowerCase();
        const cat = String(s.cat || '').toLowerCase();
        const id = String(s.id || '').toLowerCase();
        const desc = String(s.decs || s.desc || '').toLowerCase();
        return title.includes(query) || cat.includes(query) || id.includes(query) || desc.includes(query);
      });
      if (filtered.length > 0) {
        resultsContainer.innerHTML = filtered.map(s => `
          <li onclick="selectSearchResult('${s.id}')">
            <strong>${s.id}. ${s.title}</strong>
            <span style="font-size:0.78rem; color:#64748b; margin-right:6px;">(${s.cat || 'عمومی'})</span>
          </li>
        `).join('');
        resultsContainer.style.display = 'block';
      } else {
        resultsContainer.innerHTML = '<li style="color:#94a3b8; text-align:center; padding: 18px;">موردی یافت نشد</li>';
        resultsContainer.style.display = 'block';
      }
    }

    function selectSearchResult(serviceId) {
      document.getElementById('searchResults').style.display = 'none';
      document.getElementById('searchInput').value = '';
      openServiceModal(serviceId);
    }

    function lockBodyScroll() {
      savedScrollY = window.scrollY;
      document.body.style.top = `-${savedScrollY}px`;
      document.body.style.position = 'fixed';
      document.body.style.width = '100%';
      document.body.classList.add('modal-open');
    }

    // تابع جدید برای فیکس کامل کیبورد
    function adjustFooterForKeyboard() {
      const footer = document.querySelector('footer');
      const aiBtn = document.querySelector('.ai-bot-btn');
      const visualHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;

      if (visualHeight < 700) {
        // کیبورد باز است
        footer.style.bottom = '0';
        aiBtn.style.display = 'none';
      } else {
        footer.style.bottom = '0';
        aiBtn.style.display = 'block';
      }
    }

    // گوش دادن به تغییرات ویو پورت
    window.addEventListener('load', () => {
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', adjustFooterForKeyboard);
      }
      adjustFooterForKeyboard();
    });
  </script>
</body>
</html>
