<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>به‌زودی | اخبار کافی‌نت</title>
  <!-- استایل و فونت -->
  <style>
    /* ---------- ریست و تنظیمات پایه ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: #0b0f1a; /* پشتیبان در صورت عدم پشتیبانی گرادینت */
      padding: 1rem;
    }

    /* ---------- کارت اصلی با پس‌زمینه گرادینت متحرک ---------- */
    .coming-soon {
      position: relative;
      width: 100%;
      max-width: 900px;
      min-height: 500px;
      border-radius: 2.5rem;
      overflow: hidden;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 2rem 1.5rem;
      transition: box-shadow 0.3s;
      
      /* گرادینت متحرک (انیمیشن پس‌زمینه) */
      background: linear-gradient(125deg, #0f172a, #1e293b, #2d1b4e, #4a1d6d, #1e293b, #0f172a);
      background-size: 400% 400%;
      animation: gradientFlow 18s ease infinite;
    }

    /* انیمیشن حرکت گرادینت */
    @keyframes gradientFlow {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* لایه نیمه‌شفاف برای خوانایی بهتر */
    .coming-soon::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(2px);
      z-index: 1;
    }

    /* همه محتوا بالای لایه تاریک */
    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 1.2rem;
      padding: 1rem;
    }

    /* آیکن/نماد کافی‌نت */
    .icon {
      font-size: 4.5rem;
      line-height: 1;
      filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.5));
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* تیتر اصلی */
    h1 {
      font-size: clamp(2.5rem, 10vw, 5rem);
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(168, 85, 247, 0.8), 0 4px 15px rgba(0, 0, 0, 0.6);
      margin-bottom: 0.5rem;
      line-height: 1.2;
      background: linear-gradient(to left, #f0e9ff, #ffffff, #d9c9ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s infinite alternate;
    }

    @keyframes shimmer {
      0% { text-shadow: 0 0 20px rgba(192, 132, 252, 0.6); }
      100% { text-shadow: 0 0 50px rgba(216, 180, 254, 1), 0 0 20px rgba(168, 85, 247, 0.8); }
    }

    /* زیرعنوان */
    .subtitle {
      font-size: clamp(1rem, 4vw, 1.5rem);
      color: rgba(255, 255, 255, 0.9);
      max-width: 600px;
      font-weight: 400;
      backdrop-filter: blur(4px);
      padding: 0.6rem 1.8rem;
      border-radius: 60px;
      background: rgba(20, 15, 40, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      letter-spacing: 0.5px;
    }

    /* خط جداکننده تزئینی */
    .divider {
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #c084fc, #a855f7, #c084fc, transparent);
      border-radius: 10px;
      margin: 0.8rem 0;
      animation: widthPulse 3s infinite alternate;
    }

    @keyframes widthPulse {
      0% { width: 100px; opacity: 0.6; }
      100% { width: 220px; opacity: 1; }
    }

    /* فوتر - فقط لینک بازگشت */
    .footer {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 1.5rem;
      padding-top: 0.5rem;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 500;
      padding: 0.9rem 2.8rem;
      border-radius: 60px;
      transition: all 0.35s ease;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .home-link i {
      font-size: 1.3rem;
      transition: transform 0.3s;
      display: inline-block;
    }

    .home-link:hover {
      background: rgba(168, 85, 247, 0.35);
      border-color: rgba(216, 180, 254, 0.8);
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.7), 0 10px 25px -5px black;
      color: #fff;
    }

    .home-link:hover i {
      transform: translateX(-5px);
    }

    /* ریسپانسیو */
    @media (max-width: 600px) {
      .coming-soon {
        border-radius: 1.8rem;
        min-height: 450px;
        padding: 1.5rem 1rem;
      }

      .icon {
        font-size: 3.5rem;
      }

      .home-link {
        padding: 0.8rem 2rem;
        font-size: 1rem;
      }

      .subtitle {
        padding: 0.5rem 1.2rem;
        font-size: 0.95rem;
      }
    }

    @media (max-width: 380px) {
      .coming-soon {
        min-height: 400px;
      }
      .home-link {
        padding: 0.7rem 1.5rem;
        font-size: 0.9rem;
      }
    }

    /* احترام به کاهش حرکت */
    @media (prefers-reduced-motion: reduce) {
      .coming-soon {
        animation: none;
        background: linear-gradient(125deg, #0f172a, #1e293b, #2d1b4e, #4a1d6d);
        background-size: 100% 100%;
      }
      .icon, h1, .divider {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <section class="coming-soon" aria-label="به‌زودی اخبار کافی‌نت">
    <!-- محتوای اصلی -->
    <div class="content">
      <div class="icon" aria-hidden="true">☕💻</div>
      <h1>به‌زودی</h1>
      <div class="divider" aria-hidden="true"></div>
      <p class="subtitle">
        اخبار و اطلاعیه‌های کافی‌نت در راه است...
      </p>
    </div>

    <!-- فوتر با لینک صفحه اصلی -->
    <footer class="footer">
      <a href="/" class="home-link" aria-label="بازگشت به صفحه اصلی">
        <i>🏠</i>
        بازگشت به صفحه اصلی
      </a>
    </footer>
  </section>

</body>
</html>
